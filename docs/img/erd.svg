<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-user" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="grad-pet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="grad-sighting" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="grad-squad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="grad-corrob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Metadata -->
  <text x="800" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#f8fafc" letter-spacing="1.5">PET AMBER · SERVER ENTITY-RELATIONSHIP DIAGRAM (ERD)</text>
  <text x="800" y="73" text-anchor="middle" font-size="14" fill="#94a3b8">PostgreSQL 3NF Relational Architecture • Spring Data JPA / Kotlin • Crow's Foot Notation</text>
  <text x="800" y="95" text-anchor="middle" font-size="12" fill="#d97706" font-weight="600">Authors: Roman Tissera (RomanHT) &amp; Kristen Ekedal (KEKEdal) • Numbered Key Notation (FK1, FK2, UQ1..)</text>

  <!-- Connectors -->
  <!-- USER -> PET_REPORT (owns) -->
  <path d="M 370 230 L 720 230" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <circle cx="370" cy="230" r="4" fill="#38bdf8"/>
  <line x1="380" y1="220" x2="380" y2="240" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="387" y1="220" x2="387" y2="240" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="705" cy="230" r="4" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <line x1="720" y1="230" x2="705" y2="220" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="720" y1="230" x2="705" y2="240" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="720" y1="220" x2="720" y2="240" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="545" y="220" text-anchor="middle" font-size="11" fill="#7dd3fc" font-weight="600">owns (1 : 0..*)</text>

  <!-- USER -> SQUAD_MEMBERSHIP (joins) -->
  <path d="M 370 330 L 580 330 L 580 540 L 720 540" stroke="#818cf8" stroke-width="2" fill="none"/>
  <line x1="380" y1="323" x2="380" y2="337" stroke="#818cf8" stroke-width="2"/>
  <line x1="386" y1="323" x2="386" y2="337" stroke="#818cf8" stroke-width="2"/>
  <circle cx="705" cy="540" r="4" fill="none" stroke="#818cf8" stroke-width="2"/>
  <line x1="720" y1="540" x2="705" y2="532" stroke="#818cf8" stroke-width="2"/>
  <line x1="720" y1="540" x2="705" y2="548" stroke="#818cf8" stroke-width="2"/>
  <line x1="720" y1="532" x2="720" y2="548" stroke="#818cf8" stroke-width="2"/>
  <text x="475" y="320" text-anchor="middle" font-size="11" fill="#a5b4fc" font-weight="600">joins (1 : 0..*)</text>

  <!-- PET_REPORT -> SQUAD_MEMBERSHIP (mobilizes) -->
  <path d="M 870 470 L 870 495" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <line x1="863" y1="475" x2="877" y2="475" stroke="#f59e0b" stroke-width="2"/>
  <line x1="863" y1="480" x2="877" y2="480" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="870" cy="488" r="3" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="870" y1="495" x2="862" y2="487" stroke="#f59e0b" stroke-width="2"/>
  <line x1="870" y1="495" x2="878" y2="487" stroke="#f59e0b" stroke-width="2"/>

  <!-- PET_REPORT -> SIGHTING (tracks) -->
  <path d="M 1020 280 L 1180 280 L 1180 730 L 1020 730" stroke="#2dd4bf" stroke-width="2" fill="none"/>
  <line x1="1028" y1="273" x2="1028" y2="287" stroke="#2dd4bf" stroke-width="2"/>
  <line x1="1034" y1="273" x2="1034" y2="287" stroke="#2dd4bf" stroke-width="2"/>
  <circle cx="1035" cy="730" r="4" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  <line x1="1020" y1="730" x2="1035" y2="722" stroke="#2dd4bf" stroke-width="2"/>
  <line x1="1020" y1="730" x2="1035" y2="738" stroke="#2dd4bf" stroke-width="2"/>
  <line x1="1020" y1="722" x2="1020" y2="738" stroke="#2dd4bf" stroke-width="2"/>
  <text x="1195" y="505" text-anchor="middle" font-size="11" fill="#5eead4" font-weight="600" transform="rotate(90, 1195, 505)">tracks (1 : 0..*)</text>

  <!-- SIGHTING -> CORROBORATION (verifies) -->
  <path d="M 720 780 L 370 780" stroke="#c084fc" stroke-width="2" fill="none"/>
  <line x1="712" y1="773" x2="712" y2="787" stroke="#c084fc" stroke-width="2"/>
  <line x1="706" y1="773" x2="706" y2="777" stroke="#c084fc" stroke-width="2"/>
  <circle cx="385" cy="780" r="4" fill="none" stroke="#c084fc" stroke-width="2"/>
  <line x1="370" y1="780" x2="385" y2="772" stroke="#c084fc" stroke-width="2"/>
  <line x1="370" y1="780" x2="385" y2="788" stroke="#c084fc" stroke-width="2"/>
  <line x1="370" y1="772" x2="370" y2="788" stroke="#c084fc" stroke-width="2"/>
  <text x="545" y="770" text-anchor="middle" font-size="11" fill="#d8b4fe" font-weight="600">verifies (1 : 0..*)</text>

  <!-- USER -> CORROBORATION (confirms, routed on left flank) -->
  <path d="M 70 360 L 35 360 L 35 750 L 70 750" stroke="#818cf8" stroke-width="2" fill="none"/>
  <line x1="60" y1="353" x2="60" y2="367" stroke="#818cf8" stroke-width="2"/>
  <line x1="53" y1="353" x2="53" y2="367" stroke="#818cf8" stroke-width="2"/>
  <circle cx="55" cy="750" r="4" fill="none" stroke="#818cf8" stroke-width="2"/>
  <line x1="70" y1="750" x2="55" y2="742" stroke="#818cf8" stroke-width="2"/>
  <line x1="70" y1="750" x2="55" y2="758" stroke="#818cf8" stroke-width="2"/>
  <text x="22" y="550" text-anchor="middle" font-size="10.5" fill="#c7d2fe" font-weight="600" transform="rotate(-90, 22, 550)">confirms (1 : 0..*)</text>

  <!-- ==================== ENTITY 1: USER_PROFILE ==================== -->
  <g filter="url(#shadow)">
    <rect x="70" y="130" width="300" height="275" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <path d="M 70 130 L 370 130 L 370 175 L 70 175 Z" fill="url(#grad-user)" rx="10"/>
    <rect x="70" y="165" width="300" height="10" fill="url(#grad-user)"/>
    <text x="220" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">USER_PROFILE (user_profile)</text>
    
    <text x="80" y="200" font-size="11" font-weight="bold" fill="#38bdf8">PK</text>
    <text x="115" y="200" font-size="11" font-weight="600" fill="#f1f5f9">user_profile_id</text>
    <text x="260" y="200" font-size="11" fill="#94a3b8">BIGINT IDENTITY</text>

    <text x="80" y="224" font-size="11" font-weight="bold" fill="#f59e0b">UQ1</text>
    <text x="115" y="224" font-size="11" font-weight="600" fill="#f1f5f9">external_key</text>
    <text x="260" y="224" font-size="11" fill="#94a3b8">UUID NOT NULL</text>

    <text x="80" y="248" font-size="11" font-weight="bold" fill="#f59e0b">UQ2</text>
    <text x="115" y="248" font-size="11" font-weight="600" fill="#f1f5f9">oauth_key</text>
    <text x="260" y="248" font-size="11" fill="#94a3b8">VARCHAR(255) NN</text>

    <text x="80" y="272" font-size="11" font-weight="bold" fill="#f59e0b">UQ3</text>
    <text x="115" y="272" font-size="11" font-weight="600" fill="#f1f5f9">email</text>
    <text x="260" y="272" font-size="11" fill="#94a3b8">VARCHAR(255) NN</text>

    <text x="115" y="296" font-size="11" fill="#e2e8f0">display_name</text>
    <text x="260" y="296" font-size="11" fill="#94a3b8">VARCHAR(100) NN</text>

    <text x="115" y="320" font-size="11" fill="#e2e8f0">avatar_url</text>
    <text x="260" y="320" font-size="11" fill="#94a3b8">VARCHAR(1024)</text>

    <text x="115" y="344" font-size="11" fill="#e2e8f0">phone_number</text>
    <text x="260" y="344" font-size="11" fill="#94a3b8">VARCHAR(30)</text>

    <text x="115" y="368" font-size="11" fill="#e2e8f0">created</text>
    <text x="260" y="368" font-size="11" fill="#94a3b8">TIMESTAMPTZ NN</text>
  </g>

  <!-- ==================== ENTITY 2: PET_REPORT ==================== -->
  <g filter="url(#shadow)">
    <rect x="720" y="115" width="300" height="355" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <path d="M 720 115 L 1020 115 L 1020 160 L 720 160 Z" fill="url(#grad-pet)" rx="10"/>
    <rect x="720" y="150" width="300" height="10" fill="url(#grad-pet)"/>
    <text x="870" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">PET_REPORT (pet_report)</text>
    
    <text x="735" y="184" font-size="11" font-weight="bold" fill="#38bdf8">PK</text>
    <text x="765" y="184" font-size="11" font-weight="600" fill="#f1f5f9">pet_report_id</text>
    <text x="910" y="184" font-size="11" fill="#94a3b8">BIGINT IDENTITY</text>

    <text x="735" y="204" font-size="11" font-weight="bold" fill="#f59e0b">UQ1</text>
    <text x="765" y="204" font-size="11" font-weight="600" fill="#f1f5f9">external_key</text>
    <text x="910" y="204" font-size="11" fill="#94a3b8">UUID NOT NULL</text>

    <!-- Numbered FK1 -->
    <text x="735" y="224" font-size="11" font-weight="bold" fill="#ec4899">FK1</text>
    <text x="765" y="224" font-size="11" font-weight="600" fill="#f1f5f9">owner_id</text>
    <text x="910" y="224" font-size="11" fill="#94a3b8">BIGINT (CASCADE)</text>

    <text x="765" y="244" font-size="11" fill="#e2e8f0">pet_name</text>
    <text x="910" y="244" font-size="11" fill="#94a3b8">VARCHAR(100) NN</text>

    <text x="765" y="264" font-size="11" fill="#e2e8f0">species / breed</text>
    <text x="910" y="264" font-size="11" fill="#94a3b8">VARCHAR(50)/(100)</text>

    <text x="765" y="284" font-size="11" fill="#e2e8f0">color_markings</text>
    <text x="910" y="284" font-size="11" fill="#94a3b8">VARCHAR(255) NN</text>

    <text x="765" y="304" font-size="11" fill="#e2e8f0">is_microchipped</text>
    <text x="910" y="304" font-size="11" fill="#94a3b8">BOOLEAN NN</text>

    <text x="765" y="324" font-size="11" font-weight="600" fill="#38bdf8">photo_url (Cloud)</text>
    <text x="910" y="324" font-size="11" fill="#94a3b8">VARCHAR(1024)</text>

    <text x="765" y="344" font-size="11" fill="#e2e8f0">last_seen_timestamp</text>
    <text x="910" y="344" font-size="11" fill="#94a3b8">TIMESTAMPTZ NN</text>

    <text x="765" y="364" font-size="11" fill="#e2e8f0">last_seen_coords</text>
    <text x="910" y="364" font-size="11" fill="#94a3b8">DOUBLE PRECISION</text>

    <text x="765" y="384" font-size="11" fill="#e2e8f0">last_seen_address</text>
    <text x="910" y="384" font-size="11" fill="#94a3b8">VARCHAR(255)</text>

    <text x="765" y="404" font-size="11" fill="#fbbf24">status (Enum)</text>
    <text x="910" y="404" font-size="11" fill="#94a3b8">ACTIVE|REUNITED</text>

    <text x="765" y="424" font-size="11" fill="#e2e8f0">created / updated</text>
    <text x="910" y="424" font-size="11" fill="#94a3b8">TIMESTAMPTZ NN</text>
  </g>

  <!-- ==================== ENTITY 3: SQUAD_MEMBERSHIP (FK1, FK2) ==================== -->
  <g filter="url(#shadow)">
    <rect x="720" y="495" width="300" height="145" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <path d="M 720 495 L 1020 495 L 1020 535 L 720 535 Z" fill="url(#grad-squad)" rx="10"/>
    <rect x="720" y="525" width="300" height="10" fill="url(#grad-squad)"/>
    <text x="870" y="520" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">SQUAD_MEMBERSHIP (squad)</text>
    
    <text x="735" y="555" font-size="11" font-weight="bold" fill="#38bdf8">PK</text>
    <text x="765" y="555" font-size="11" font-weight="600" fill="#f1f5f9">squad_membership_id</text>
    <text x="910" y="555" font-size="11" fill="#94a3b8">BIGINT IDENTITY</text>

    <!-- Numbered FK1 -->
    <text x="735" y="575" font-size="11" font-weight="bold" fill="#ec4899">FK1</text>
    <text x="765" y="575" font-size="11" font-weight="600" fill="#f1f5f9">user_id</text>
    <text x="910" y="575" font-size="11" fill="#94a3b8">BIGINT UQ1 (CASCADE)</text>

    <!-- Numbered FK2 -->
    <text x="735" y="595" font-size="11" font-weight="bold" fill="#ec4899">FK2</text>
    <text x="765" y="595" font-size="11" font-weight="600" fill="#f1f5f9">pet_report_id</text>
    <text x="910" y="595" font-size="11" fill="#94a3b8">BIGINT UQ1 (CASCADE)</text>

    <text x="765" y="615" font-size="11" fill="#e2e8f0">joined / is_active</text>
    <text x="910" y="615" font-size="11" fill="#94a3b8">TIMESTAMPTZ, BOOL</text>
  </g>

  <!-- ==================== ENTITY 4: SIGHTING (UQ1, FK1, FK2) ==================== -->
  <g filter="url(#shadow)">
    <rect x="720" y="660" width="300" height="280" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <path d="M 720 660 L 1020 660 L 1020 700 L 720 700 Z" fill="url(#grad-sighting)" rx="10"/>
    <rect x="720" y="690" width="300" height="10" fill="url(#grad-sighting)"/>
    <text x="870" y="685" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">SIGHTING (sighting)</text>
    
    <text x="735" y="720" font-size="11" font-weight="bold" fill="#38bdf8">PK</text>
    <text x="765" y="720" font-size="11" font-weight="600" fill="#f1f5f9">sighting_id</text>
    <text x="910" y="720" font-size="11" fill="#94a3b8">BIGINT IDENTITY</text>

    <text x="735" y="740" font-size="11" font-weight="bold" fill="#f59e0b">UQ1</text>
    <text x="765" y="740" font-size="11" font-weight="600" fill="#f1f5f9">external_key</text>
    <text x="910" y="740" font-size="11" fill="#94a3b8">UUID NOT NULL</text>

    <!-- Numbered FK1 -->
    <text x="735" y="760" font-size="11" font-weight="bold" fill="#ec4899">FK1</text>
    <text x="765" y="760" font-size="11" font-weight="600" fill="#f1f5f9">pet_report_id</text>
    <text x="910" y="760" font-size="11" fill="#94a3b8">BIGINT (CASCADE)</text>

    <!-- Numbered FK2 -->
    <text x="735" y="780" font-size="11" font-weight="bold" fill="#ec4899">FK2</text>
    <text x="765" y="780" font-size="11" font-weight="600" fill="#f1f5f9">spotter_id</text>
    <text x="910" y="780" font-size="11" fill="#94a3b8">BIGINT (RESTRICT)</text>

    <text x="765" y="800" font-size="11" font-weight="600" fill="#38bdf8">photo_url (Evidence)</text>
    <text x="910" y="800" font-size="11" fill="#94a3b8">VARCHAR(1024)</text>

    <text x="765" y="820" font-size="11" fill="#e2e8f0">sighting_timestamp</text>
    <text x="910" y="820" font-size="11" fill="#94a3b8">TIMESTAMPTZ NN</text>

    <text x="765" y="840" font-size="11" fill="#e2e8f0">latitude, longitude</text>
    <text x="910" y="840" font-size="11" fill="#94a3b8">DOUBLE PRECISION</text>

    <text x="765" y="860" font-size="11" fill="#5eead4">direction (Enum)</text>
    <text x="910" y="860" font-size="11" fill="#94a3b8">COMPASS 8-WAY</text>

    <text x="765" y="880" font-size="11" fill="#e2e8f0">direction_notes</text>
    <text x="910" y="880" font-size="11" fill="#94a3b8">VARCHAR(255)</text>

    <text x="765" y="900" font-size="11" fill="#e2e8f0">notes / created</text>
    <text x="910" y="900" font-size="11" fill="#94a3b8">TEXT, TIMESTAMPTZ</text>
  </g>

  <!-- ==================== ENTITY 5: CORROBORATION (FK1, FK2) ==================== -->
  <g filter="url(#shadow)">
    <rect x="70" y="680" width="300" height="200" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <path d="M 70 680 L 370 680 L 370 720 L 70 720 Z" fill="url(#grad-corrob)" rx="10"/>
    <rect x="70" y="710" width="300" height="10" fill="url(#grad-corrob)"/>
    <text x="220" y="705" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">CORROBORATION (corroboration)</text>
    
    <text x="80" y="742" font-size="11" font-weight="bold" fill="#38bdf8">PK</text>
    <text x="115" y="742" font-size="11" font-weight="600" fill="#f1f5f9">corroboration_id</text>
    <text x="260" y="742" font-size="11" fill="#94a3b8">BIGINT IDENTITY</text>

    <!-- Numbered FK1 -->
    <text x="80" y="764" font-size="11" font-weight="bold" fill="#ec4899">FK1</text>
    <text x="115" y="764" font-size="11" font-weight="600" fill="#f1f5f9">sighting_id</text>
    <text x="260" y="764" font-size="11" fill="#94a3b8">BIGINT UQ1 (CASCADE)</text>

    <!-- Numbered FK2 -->
    <text x="80" y="786" font-size="11" font-weight="bold" fill="#ec4899">FK2</text>
    <text x="115" y="786" font-size="11" font-weight="600" fill="#f1f5f9">user_id</text>
    <text x="260" y="786" font-size="11" fill="#94a3b8">BIGINT UQ1 (CASCADE)</text>

    <text x="115" y="808" font-size="11" fill="#e2e8f0">is_confirmed</text>
    <text x="260" y="808" font-size="11" fill="#94a3b8">BOOLEAN NN</text>

    <text x="115" y="830" font-size="11" fill="#e2e8f0">corroboration_notes</text>
    <text x="260" y="830" font-size="11" fill="#94a3b8">VARCHAR(500)</text>

    <text x="115" y="852" font-size="11" fill="#e2e8f0">created</text>
    <text x="260" y="852" font-size="11" fill="#94a3b8">TIMESTAMPTZ NN</text>
  </g>

  <!-- Legend / Notation Key at Bottom Left (Fully Numbered Keys: PK un-numbered, FK1, FK2, UQ1, UQ2, UQ3) -->
  <g filter="url(#shadow)">
    <rect x="70" y="415" width="490" height="245" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="90" y="438" font-size="12" font-weight="bold" fill="#f8fafc">RELATIONAL ARCHITECTURE &amp; NOTATION KEY</text>
    <line x1="90" y1="446" x2="540" y2="446" stroke="#475569" stroke-width="1"/>
    
    <text x="90" y="465" font-size="11" font-weight="bold" fill="#38bdf8">PK</text>
    <text x="125" y="465" font-size="10.5" fill="#cbd5e1">Primary Key (Surrogate BIGINT IDENTITY - strictly un-numbered)</text>

    <text x="90" y="483" font-size="11" font-weight="bold" fill="#ec4899">FK1</text>
    <text x="125" y="483" font-size="10.5" fill="#cbd5e1">Foreign Key 1 (Primary parent link: owner_id, pet_report_id, sighting_id)</text>

    <text x="90" y="501" font-size="11" font-weight="bold" fill="#ec4899">FK2</text>
    <text x="125" y="501" font-size="10.5" fill="#cbd5e1">Foreign Key 2 (Secondary parent link: spotter_id, pet_report_id, user_id)</text>

    <text x="90" y="519" font-size="11" font-weight="bold" fill="#f59e0b">UQ1</text>
    <text x="125" y="519" font-size="10.5" fill="#cbd5e1">Unique Key 1 (Public UUID external_key / Composite unique pair)</text>

    <text x="90" y="537" font-size="11" font-weight="bold" fill="#f59e0b">UQ2</text>
    <text x="125" y="537" font-size="10.5" fill="#cbd5e1">Unique Key 2 (OAuth Google subject identifier: oauth_key)</text>

    <text x="90" y="555" font-size="11" font-weight="bold" fill="#f59e0b">UQ3</text>
    <text x="125" y="555" font-size="10.5" fill="#cbd5e1">Unique Key 3 (Unique user email address: email)</text>

    <line x1="90" y1="565" x2="540" y2="565" stroke="#334155" stroke-width="1"/>

    <text x="90" y="580" font-size="10" fill="#94a3b8">Crow's Foot: ||--o{ = One to Zero-or-More (Strictly normalized 3NF)</text>
